image: gradle:8.7-jdk17

stages:
  - build

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/
    - android-sdk/

build_debug_apk:
  stage: build
  before_script:
    - apt-get update
    - apt-get install -y wget unzip
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip && unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools" && mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"; fi
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - yes | sdkmanager --licenses
    - sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
  script:
    - gradle assembleDebug
  artifacts:
    name: "dlt-predictor-debug-apk"
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 14 days
