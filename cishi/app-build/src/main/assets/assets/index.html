<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>影视TV</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🎬</span>
                    <span class="logo-text">影视TV</span>
                </div>
                <nav class="nav-tabs">
                    <button class="nav-tab active" data-tab="home">首页</button>
                    <button class="nav-tab" data-tab="live">直播</button>
                    <button class="nav-tab" data-tab="mine">我的</button>
                </nav>
                <button class="config-btn" id="configBtn" title="配置">⚙️</button>
            </div>
        </header>

        <!-- 搜索框 -->
        <div class="search-section">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索影片..." class="search-input">
                <button class="search-clear" id="searchClear" style="display:none;">✕</button>
            </div>
        </div>

        <!-- 配置面板 -->
        <div class="config-panel" id="configPanel" style="display:none;">
            <div class="config-content">
                <h3>接口配置</h3>
                <div class="config-item">
                    <label>数据源地址</label>
                    <input type="text" id="configUrl" value="http://www.饭太硬.net/tv" placeholder="请输入数据源地址">
                </div>
                <div class="config-actions">
                    <button class="btn btn-secondary" id="configCancel">取消</button>
                    <button class="btn btn-primary" id="configSave">保存</button>
                </div>
            </div>
        </div>

        <!-- 首页内容 -->
        <main class="main-content" id="homeTab">
            <!-- 分类标签栏 -->
            <div class="category-bar">
                <div class="category-scroll" id="categoryScroll">
                    <button class="category-btn active" data-category="all">全部</button>
                    <button class="category-btn" data-category="movie">电影</button>
                    <button class="category-btn" data-category="tv">电视剧</button>
                    <button class="category-btn" data-category="anime">动漫</button>
                    <button class="category-btn" data-category="variety">综艺</button>
                </div>
            </div>

            <!-- 影片网格 -->
            <div class="movie-grid" id="movieGrid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>

            <!-- 加载更多 -->
            <div class="load-more" id="loadMore" style="display:none;">
                <button class="btn btn-outline" id="loadMoreBtn">加载更多</button>
            </div>
        </main>

        <!-- 直播内容 -->
        <main class="main-content" id="liveTab" style="display:none;">
            <div class="live-list" id="liveList">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>
        </main>

        <!-- 我的页面 -->
        <main class="main-content" id="mineTab" style="display:none;">
            <div class="mine-section">
                <div class="user-info">
                    <div class="avatar">👤</div>
                    <div class="user-detail">
                        <h3>游客用户</h3>
                        <p>欢迎使用影视TV</p>
                    </div>
                </div>
                <div class="mine-menu">
                    <div class="menu-item">
                        <span class="menu-icon">⭐</span>
                        <span class="menu-text">我的收藏</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item">
                        <span class="menu-icon">📺</span>
                        <span class="menu-text">观看历史</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item">
                        <span class="menu-icon">⚙️</span>
                        <span class="menu-text">设置</span>
                        <span class="menu-arrow">›</span>
                    </div>
                    <div class="menu-item">
                        <span class="menu-icon">ℹ️</span>
                        <span class="menu-text">关于</span>
                        <span class="menu-arrow">›</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 视频播放弹窗 -->
    <div class="player-modal" id="playerModal">
        <div class="player-overlay" id="playerOverlay"></div>
        <div class="player-container">
            <div class="player-header">
                <h3 class="player-title" id="playerTitle">视频播放</h3>
                <button class="player-close" id="playerClose">✕</button>
            </div>
            <div class="player-body">
                <div class="video-wrapper">
                    <video id="videoPlayer" controls playsinline webkit-playsinline>
                        您的浏览器不支持视频播放
                    </video>
                </div>
                <div class="player-info">
                    <h4 id="playerName">影片名称</h4>
                    <p class="player-desc" id="playerDesc">暂无简介</p>
                </div>
                <div class="player-sources">
                    <h5>播放源</h5>
                    <div class="source-list" id="sourceList">
                        <button class="source-btn active">源1</button>
                    </div>
                </div>
                <div class="player-episodes">
                    <h5>选集</h5>
                    <div class="episode-list" id="episodeList">
                        <button class="episode-btn active">第1集</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>

    <script src="js/nc-movie-engine.js"></script>
    <script src="js/nc-repo.js"></script>
    <script src="js/nc-live.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
